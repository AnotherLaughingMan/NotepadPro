<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NotepadPro WebView — Dev Test Harness</title>
  <style>
    body { font-family: Consolas, monospace; font-size: 13px; background: #1e1e1e; color: #d4d4d4; margin: 0; display: flex; height: 100vh; }
    #panel { width: 280px; flex-shrink: 0; background: #252526; border-right: 1px solid #444; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    #frame-wrap { flex: 1; position: relative; }
    iframe { width: 100%; height: 100%; border: none; }
    button { width: 100%; padding: 6px 10px; background: #0e639c; color: #fff; border: none; border-radius: 3px; cursor: pointer; font-size: 12px; text-align: left; }
    button:hover { background: #1177bb; }
    h3 { margin: 8px 0 2px; color: #9cdcfe; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
    select, textarea { width: 100%; background: #3c3c3c; color: #d4d4d4; border: 1px solid #555; border-radius: 3px; padding: 4px 6px; font-family: Consolas, monospace; font-size: 12px; box-sizing: border-box; }
    textarea { height: 80px; resize: vertical; }
    label { font-size: 11px; color: #858585; }
    .log { font-size: 11px; color: #858585; background: #1e1e1e; border: 1px solid #333; border-radius: 3px; padding: 6px; max-height: 100px; overflow-y: auto; }
  </style>
</head>
<body>
  <div id="panel">
    <h3>File</h3>
    <select id="lang-select">
      <option value="plaintext">Plain Text</option>
      <option value="markdown" selected>Markdown</option>
      <option value="javascript">JavaScript</option>
      <option value="typescript">TypeScript</option>
      <option value="csharp">C#</option>
      <option value="json">JSON</option>
      <option value="xml">XML</option>
      <option value="html">HTML</option>
      <option value="css">CSS</option>
      <option value="python">Python</option>
    </select>
    <button onclick="openFile()">Open Sample File</button>
    <button onclick="send({type:'file:saved'})">Signal: File Saved</button>

    <h3>Theme</h3>
    <select id="theme-select" onchange="applyTheme()">
      <option value="dark-plus">Dark+</option>
      <option value="dark-modern">Dark Modern</option>
      <option value="one-dark-pro">One Dark Pro</option>
      <option value="monokai-pro">Monokai Pro</option>
      <option value="solarized-dark">Solarized Dark</option>
      <option value="light-plus">Light+</option>
    </select>

    <h3>Startup Check</h3>
    <div class="log" id="startup-check">Waiting for editor diagnostics...</div>
    <button onclick="runStartupCheck()">Run Startup Check</button>

    <h3>Settings</h3>
    <button onclick="toggleWordWrap()">Toggle Word Wrap</button>
    <button onclick="toggleMinimap()">Toggle Minimap</button>
    <button onclick="toggleLineNumbers()">Toggle Line Numbers</button>
    <label>Font size: <input type="range" id="font-size" min="10" max="24" value="13" oninput="setFontSize(this.value)" style="width:100%"></label>

    <h3>Navigation</h3>
    <button onclick="goToLine()">Go To Line 10</button>
    <button onclick="send({type:'editor:command',command:'editor.action.formatDocument'})">Format Document</button>
    <button onclick="send({type:'editor:command',command:'editor.action.commentLine'})">Toggle Comment</button>
    <button onclick="send({type:'editor:command',command:'editor.action.startFindReplaceAction'})">Find & Replace</button>

    <h3>Markdown Preview</h3>
    <button onclick="send({type:'preview:toggle',visible:true})">Show Preview</button>
    <button onclick="send({type:'preview:toggle',visible:false})">Hide Preview</button>

    <h3>Raw Message</h3>
    <textarea id="raw-msg">{"type":"editor:navigate","line":1}</textarea>
    <button onclick="sendRaw()">Send Raw</button>

    <h3>Console Log</h3>
    <div class="log" id="log"></div>
  </div>
  <div id="frame-wrap">
    <iframe id="editor-frame" src="index.html"></iframe>
  </div>

  <script>
    const frame = document.getElementById('editor-frame');
    const log   = document.getElementById('log');
    const startupCheck = document.getElementById('startup-check');

    let settings = {
      wordWrap: false, showLineNumbers: true, isMinimapVisible: true,
      autoIndentation: true, autoBracketing: true, editorFontSize: 13,
      indentation: '    ', eol: 'LF',
    };

    const themes = {
      'dark-plus':      { background:'#1e1e1e', foreground:'#d4d4d4', selectionBackground:'#264f78', lineHighlight:'#2a2d2e', syntaxKeyword:'#569cd6', syntaxString:'#ce9178', syntaxComment:'#6a9955', syntaxNumber:'#b5cea8', syntaxType:'#4ec9b0', syntaxFunction:'#dcdcaa' },
      'dark-modern':    { background:'#1f1f1f', foreground:'#cccccc', selectionBackground:'#264f78', lineHighlight:'#282828', syntaxKeyword:'#569cd6', syntaxString:'#ce9178', syntaxComment:'#608b4e', syntaxNumber:'#b5cea8', syntaxType:'#4ec9b0', syntaxFunction:'#dcdcaa' },
      'one-dark-pro':   { background:'#282c34', foreground:'#abb2bf', selectionBackground:'#3e4451', lineHighlight:'#2c313a', syntaxKeyword:'#c678dd', syntaxString:'#98c379', syntaxComment:'#5c6370', syntaxNumber:'#d19a66', syntaxType:'#e5c07b', syntaxFunction:'#61afef' },
      'monokai-pro':    { background:'#2d2a2e', foreground:'#fcfcfa', selectionBackground:'#6e6c69', lineHighlight:'#363537', syntaxKeyword:'#ff6188', syntaxString:'#ffd866', syntaxComment:'#727072', syntaxNumber:'#ab9df2', syntaxType:'#a9dc76', syntaxFunction:'#78dce8' },
      'solarized-dark': { background:'#002b36', foreground:'#839496', selectionBackground:'#073642', lineHighlight:'#073642', syntaxKeyword:'#859900', syntaxString:'#2aa198', syntaxComment:'#586e75', syntaxNumber:'#d33682', syntaxType:'#b58900', syntaxFunction:'#268bd2' },
      'light-plus':     { background:'#ffffff', foreground:'#000000', selectionBackground:'#add6ff', lineHighlight:'#f0f0f0', syntaxKeyword:'#0000ff', syntaxString:'#a31515', syntaxComment:'#008000', syntaxNumber:'#098658', syntaxType:'#267f99', syntaxFunction:'#795e26' },
    };

    const samples = {
      markdown: `# Hello, Notepad Pro\n\nThis is a **bold** statement with *italic* text.\n\n## Features\n\n- Monaco editor\n- Markdown preview\n- Real syntax highlighting\n\n\`\`\`typescript\nconst greet = (name: string) => \`Hello, \${name}!\`;\nconsole.log(greet('World'));\n\`\`\`\n\n> This is a blockquote\n\n| Column 1 | Column 2 |\n|----------|----------|\n| Cell A   | Cell B   |\n`,
      typescript: `interface User {\n  id: number;\n  name: string;\n  email?: string;\n}\n\nclass UserService {\n  private users: User[] = [];\n\n  add(user: User): void {\n    this.users.push(user);\n  }\n\n  findById(id: number): User | undefined {\n    return this.users.find(u => u.id === id);\n  }\n}\n\nconst svc = new UserService();\nsvc.add({ id: 1, name: 'Alice', email: 'alice@example.com' });\n`,
      csharp: `using System;\nusing System.Collections.Generic;\n\nnamespace NotepadPro.Models;\n\n/// <summary>Represents an open document.</summary>\npublic sealed class Document\n{\n    public string Path { get; }\n    public string Content { get; private set; }\n    public bool IsDirty { get; private set; }\n\n    public Document(string path, string content)\n    {\n        Path    = path ?? throw new ArgumentNullException(nameof(path));\n        Content = content;\n    }\n\n    public void Edit(string newContent)\n    {\n        if (Content == newContent) return;\n        Content = newContent;\n        IsDirty = true;\n    }\n}\n`,
      json: `{\n  "name": "notepadpro-webview",\n  "version": "1.0.0",\n  "dependencies": {\n    "monaco-editor": "^0.52.0",\n    "markdown-it": "^14.1.0"\n  },\n  "scripts": {\n    "build": "vite build",\n    "dev": "vite"\n  }\n}\n`,
      plaintext: `This is plain text.\nNo syntax highlighting here.\nJust simple words on a page.\n`,
    };

    function send(msg) {
      const bridge = frame.contentWindow?.__bridge;
      if (!bridge) { addLog('Editor not ready yet'); return; }
      bridge.simulate(msg);
      addLog(`→ ${msg.type}`);
    }

    function sendRaw() {
      try { send(JSON.parse(document.getElementById('raw-msg').value)); }
      catch (e) { addLog('Parse error: ' + e.message); }
    }

    function openFile() {
      const lang    = document.getElementById('lang-select').value;
      const content = samples[lang] ?? samples.plaintext;
      send({ type: 'file:open', path: `/test/sample.${lang}`, content, language: lang });
      if (lang === 'markdown') send({ type: 'preview:toggle', visible: true });
    }

    function applyTheme() {
      const name   = document.getElementById('theme-select').value;
      const colors = themes[name];
      send({ type: 'theme:apply', theme: name, colors });
    }

    function toggleWordWrap() {
      settings = { ...settings, wordWrap: !settings.wordWrap };
      send({ type: 'settings:apply', settings });
      addLog(`wordWrap → ${settings.wordWrap}`);
    }

    function toggleMinimap() {
      settings = { ...settings, isMinimapVisible: !settings.isMinimapVisible };
      send({ type: 'settings:apply', settings });
      addLog(`minimap → ${settings.isMinimapVisible}`);
    }

    function toggleLineNumbers() {
      settings = { ...settings, showLineNumbers: !settings.showLineNumbers };
      send({ type: 'settings:apply', settings });
      addLog(`lineNumbers → ${settings.showLineNumbers}`);
    }

    function setFontSize(val) {
      settings = { ...settings, editorFontSize: Number(val) };
      send({ type: 'settings:apply', settings });
    }

    function goToLine() {
      send({ type: 'editor:navigate', line: 10, column: 1 });
    }

    function addLog(msg) {
      log.textContent = `${new Date().toLocaleTimeString()} ${msg}\n` + log.textContent;
    }

    function runStartupCheck() {
      const diagnostics = frame.contentWindow?.__notepadproDiagnostics;
      if (!diagnostics) {
        startupCheck.textContent = 'Editor diagnostics not available yet.';
        addLog('startup check → diagnostics unavailable');
        return;
      }

      if (diagnostics.syntaxHighlightingReady) {
        startupCheck.textContent = `PASS\nRegistered ${diagnostics.registeredLanguageIds.length} languages.\nAll required Monaco language contributions are loaded.`;
        addLog(`startup check → pass (${diagnostics.registeredLanguageIds.length} languages)`);
        return;
      }

      startupCheck.textContent = `FAIL\nMissing: ${diagnostics.missingLanguageIds.join(', ')}`;
      addLog(`startup check → fail (${diagnostics.missingLanguageIds.join(', ')})`);
    }

    // Auto-init: open markdown sample and apply dark+ theme once the iframe is ready
    frame.addEventListener('load', () => {
      setTimeout(() => {
        applyTheme();
        openFile();
        runStartupCheck();
      }, 600); // give Monaco time to init after load
    });
  </script>
</body>
</html>
