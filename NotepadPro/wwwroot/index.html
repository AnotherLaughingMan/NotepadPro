<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <meta name="color-scheme" content="dark light" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; worker-src blob:;" />
    <title>Notepad Pro Editor</title>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--editor-bg, #1e1e1e);
        color: var(--editor-fg, #d4d4d4);
         color-scheme: var(--page-color-scheme, dark);
      }

       :root {
         color-scheme: dark light;
       }

      #editor-container {
        display: flex;
        width: 100vw;
        height: 100vh;
      }

      #monaco-editor {
        flex: 1;
        height: 100%;
        min-width: 0;
      }

      .monaco-editor .minimap {
        opacity: var(--monaco-minimap-opacity, 1);
        transition: opacity var(--monaco-minimap-fade-duration-ms, 140ms) ease-out;
      }

      .monaco-editor .bookmark-glyph-scoped,
      .monaco-editor .bookmark-glyph-global,
      .monaco-editor .bookmark-glyph-stale {
        background-position: center;
        background-repeat: no-repeat;
        background-size: 8px 8px;
      }

      .monaco-editor .bookmark-glyph-scoped {
        background-image: radial-gradient(circle, #4da3ff 0 45%, transparent 50%);
      }

      .monaco-editor .bookmark-glyph-global {
        background-image: radial-gradient(circle, #5bc08a 0 45%, transparent 50%);
      }

      .monaco-editor .bookmark-glyph-stale {
        background-image: radial-gradient(circle, #f2c14e 0 45%, transparent 50%);
      }

      #preview-splitter {
        width: 4px;
        background: var(--border-color, #444);
        cursor: col-resize;
        flex-shrink: 0;
        display: none;
      }

      #preview-pane {
        width: 50%;
        height: 100%;
        overflow-y: auto;
        padding: 20px 28px;
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.65;
        background: var(--editor-bg, #1e1e1e);
        color: var(--editor-fg, #d4d4d4);
        display: none;
        flex-shrink: 0;
        color-scheme: var(--preview-color-scheme, dark);
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      #preview-pane::-webkit-scrollbar {
        width: 0;
        height: 0;
        display: none;
      }

      #preview-scrollbar {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 8px;
        display: none;
        z-index: 5;
        pointer-events: auto;
        opacity: 0;
        transition: opacity 260ms ease;
      }

      #preview-scrollbar[data-active='true'] {
        opacity: 1;
      }

      #preview-scrollbar::before {
        content: '';
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        background: transparent;
      }

      #preview-scrollbar-thumb {
        position: absolute;
        top: 0;
        right: 1px;
        width: 6px;
        min-height: 24px;
        border-radius: 999px;
        background: var(--preview-scrollbar-thumb, rgba(212, 212, 212, 0.18));
        border: none;
        box-shadow: none;
        transform: translateY(0);
      }

      #preview-scrollbar:hover #preview-scrollbar-thumb,
      #preview-scrollbar[data-dragging='true'] #preview-scrollbar-thumb {
        background: var(--preview-scrollbar-thumb-hover, rgba(212, 212, 212, 0.5));
      }
      #preview-pane::-webkit-scrollbar,
      #preview-pane pre::-webkit-scrollbar {
        width: 10px;
        height: 10px;
        background-color: var(--preview-scrollbar-track, rgba(0, 0, 0, 0.18));
      }

      #preview-pane::-webkit-scrollbar-track,
      #preview-pane pre::-webkit-scrollbar-track {
        background-color: var(--preview-scrollbar-track, rgba(0, 0, 0, 0.18));
      }

      #preview-pane::-webkit-scrollbar-thumb,
      #preview-pane pre::-webkit-scrollbar-thumb {
        -webkit-appearance: none;
        background-color: var(--preview-scrollbar-thumb, rgba(212, 212, 212, 0.45));
        border: 2px solid var(--preview-scrollbar-track, rgba(0, 0, 0, 0.18));
        border-radius: 999px;
      }

      #preview-pane::-webkit-scrollbar-thumb:hover,
      #preview-pane pre::-webkit-scrollbar-thumb:hover {
        background-color: var(--preview-scrollbar-thumb-hover, rgba(212, 212, 212, 0.65));
      }

      #preview-pane[data-markdown-edit-mode='readonly-large']::before {
        content: 'Rendered view is read-only for large Markdown files. Switch to Source view to edit.';
        display: block;
        margin: 0 0 14px 0;
        padding: 8px 10px;
        font-size: 12px;
        line-height: 1.4;
        border: 1px solid rgba(242, 193, 78, 0.55);
        background: rgba(242, 193, 78, 0.15);
        color: var(--editor-fg, #d4d4d4);
        border-radius: 6px;
      }

      #editor-container.preview-visible #preview-splitter,
      #editor-container.preview-visible #preview-pane {
        display: block;
      }

      /* === Monaco scrollbar opacity === */
      .monaco-scrollable-element {
        opacity: var(--monaco-scrollbar-opacity, 1) !important;
        transition: opacity 0.2s;
      }

      /* === Markdown preview styles === */
      #preview-pane h1, #preview-pane h2, #preview-pane h3,
      #preview-pane h4, #preview-pane h5, #preview-pane h6 {
        margin: 1.2em 0 0.5em;
        line-height: 1.3;
        color: var(--editor-fg, #d4d4d4);
      }
      #preview-pane h1 { font-size: 2em; border-bottom: 1px solid var(--border-color, #444); padding-bottom: 0.2em; }
      #preview-pane h2 { font-size: 1.5em; border-bottom: 1px solid var(--border-color, #444); padding-bottom: 0.2em; }
      #preview-pane h3 { font-size: 1.25em; }
      #preview-pane p { margin: 0.75em 0; }
      #preview-pane a { color: #4ec9b0; text-decoration: none; }
      #preview-pane a:hover { text-decoration: underline; }
      #preview-pane code {
        font-family: 'Cascadia Code', 'Consolas', monospace;
        font-size: 0.9em;
        background: rgba(255,255,255,0.08);
        padding: 0.15em 0.4em;
        border-radius: 3px;
      }
      #preview-pane pre {
        background: rgba(0,0,0,0.25);
        border: 1px solid var(--border-color, #444);
        border-radius: 6px;
        padding: 12px 16px;
        overflow-x: auto;
        margin: 1em 0;
      }
      #preview-pane pre code { background: none; padding: 0; font-size: 0.875em; }
      #preview-pane blockquote {
        border-left: 3px solid var(--border-color, #555);
        margin: 0.75em 0;
        padding: 4px 16px;
        opacity: 0.8;
      }
      #preview-pane ul, #preview-pane ol { padding-left: 1.75em; margin: 0.5em 0; }
      #preview-pane li { margin: 0.25em 0; }
      #preview-pane table {
        border-collapse: collapse;
        width: 100%;
        margin: 1em 0;
      }
      #preview-pane th, #preview-pane td {
        border: 1px solid var(--border-color, #444);
        padding: 6px 12px;
        text-align: left;
      }
      #preview-pane th { background: rgba(255,255,255,0.06); font-weight: 600; }
      #preview-pane img { max-width: 100%; border-radius: 4px; }
      #preview-pane hr { border: none; border-top: 1px solid var(--border-color, #444); margin: 1.5em 0; }
    </style>
    <script type="module" crossorigin src="/assets/index-DLGNIMkW.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DIPB3Vbg.css">
  </head>
  <body>
    <!-- Welcome view — shown by host via view:show welcome message -->
    <div id="welcome-view" style="display:none; width:100vw; height:100vh; overflow:hidden;"></div>

    <!-- Editor view — Monaco + optional markdown preview pane -->
    <div id="editor-container">
      <div id="monaco-editor"></div>
      <div id="preview-splitter"></div>
      <div id="preview-pane"></div>
      <div id="preview-scrollbar" aria-hidden="true">
        <div id="preview-scrollbar-thumb"></div>
      </div>
    </div>
  </body>
</html>
